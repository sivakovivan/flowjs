name: CI CD Workflow

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    verify:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        env:
            FLOW_AI_MODE: recorded
            FLOW_ANALYTICS_ENABLED: '0'
        services:
            timescale:
                image: timescale/timescaledb-ha:pg17
                env:
                    POSTGRES_PASSWORD: flowjs-ci
                    POSTGRES_DB: flowjs_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d flowjs_test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 12

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check formatting
              run: pnpm format:check

            - name: Typecheck
              run: |
                  pnpm typecheck
                  pnpm --dir apps/demo typecheck
                  pnpm --dir apps/analytics typecheck

            - name: Run unit tests
              run: |
                  pnpm test
                  pnpm --dir apps/demo test

            - name: Test analytics against TimescaleDB
              env:
                  FLOW_ANALYTICS_TEST_DATABASE_URL: postgresql://postgres:flowjs-ci@127.0.0.1:5432/flowjs_test?sslmode=disable
              run: pnpm --dir apps/analytics test

            - name: Build
              run: pnpm build
